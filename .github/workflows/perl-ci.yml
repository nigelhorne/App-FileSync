---
# Created by App::GHGen::PerlCustomizer
name: Perl CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        perl:
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
        exclude:
          - os: windows-latest
            perl: "5.40"
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        id: setup-perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: ${{ matrix.perl }}

      - name: Get exact Perl binary version for cache key
        id: perl-version
        shell: perl {0}
        run: |
          use Config;
          my @paths = ($^X);
          if ($^O eq 'MSWin32' && $Config{libperl}) {
              (my $dir = $^X) =~ s{[\\/][^\\/]+$}{};
              my $dll = "$dir/$Config{libperl}";
              push @paths, $dll if -f $dll;
          }
          my $sum = 0;
          for my $path (@paths) {
              open(my $fh, '<:raw', $path) or next;
              $sum += unpack('%32C*', $_) while read $fh, $_, 65536;
          }
          open(my $out, '>>', $ENV{GITHUB_OUTPUT}) or die $!;
          print $out "version=$Config{version}-$Config{archname}-$sum\n";

      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-

      - name: Install cpanm and local::lib
        if: runner.os != 'Windows'
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install cpanm and local::lib (Windows)
        if: runner.os == 'Windows'
        run: cpanm --notest App::cpanminus local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        if: runner.os == 'Linux'
        run: |
           sudo apt update
           sudo apt install libdb-dev libperl-dev
      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps --verbose .

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          cpanm --notest --installdeps --verbose .

      - name: Reinstall YAML::XS against current Perl (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cpanm --notest --reinstall YAML::XS

      - name: Lint and syntax check
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          use File::Find;
          use lib 'lib';
          my @failed;
          push @INC, sub { open my $h, '<', \qq{1;\n}; $h };
          my @dirs = grep { -d } qw(lib bin);
          @dirs = ('.') unless @dirs;
          find({ wanted => sub {
              return unless -f && /\.pm$/;
              my $file = $File::Find::name;
              do $file;
              if ($@) {
                  warn "Syntax check failed: $file\n";
                  push @failed, $file;
              }
          }, no_chdir => 1 }, @dirs);

          if (($ENV{RUNNER_OS} // '') eq 'Linux') {
              system('cpanm --notest --quiet warnings::unused 2>/dev/null');
              system('PERL5OPT=-Mwarnings::unused prove -lr t/ 2>&1 | grep -i unused && true || echo "warnings::unused: no unused variables detected"');
          }

          exit(@failed ? 1 : 0);

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          prove -lr t/

      # Temporary: find out why every Perl process exits 5 on some runners.
      - name: Probe Perl exit statuses (Windows)
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          echo === baseline
          perl -e "print qq{baseline\n}"
          echo exit=%ERRORLEVEL%
          echo === plain Test::More
          perl -e "use Test::More tests => 1; ok(1, q{plain})"
          echo exit=%ERRORLEVEL%
          echo === use IPC::Open3
          perl -e "use IPC::Open3 (); print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use POSIX
          perl -e "use POSIX (); print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use Config::Abstraction
          perl -e "use Config::Abstraction; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use Log::Abstraction
          perl -e "use Log::Abstraction; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use Object::Configure
          perl -e "use Object::Configure; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use App::FileSync
          perl -Ilib -e "use App::FileSync; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use App::FileSync then exit 0
          perl -Ilib -e "use App::FileSync; print qq{loaded\n}; exit 0"
          echo exit=%ERRORLEVEL%
          echo === use App::FileSync::Transport::SSH
          perl -Ilib -e "use App::FileSync::Transport::SSH; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === old SSH transport
          mkdir oldssh\App\FileSync\Transport
          git show 82896fa:lib/App/FileSync/Transport/SSH.pm > oldssh\App\FileSync\Transport\SSH.pm
          perl -Ioldssh -Ilib -e "use App::FileSync::Transport::SSH; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use App::FileSync::Admin
          perl -Ilib -e "use App::FileSync::Admin; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === use App::FileSync::CLI
          perl -Ilib -e "use App::FileSync::CLI; print qq{loaded\n}"
          echo exit=%ERRORLEVEL%
          echo === Test::Most with App::FileSync
          perl -Ilib -e "use Test::Most; use_ok(q{App::FileSync}); done_testing()"
          echo exit=%ERRORLEVEL%
          echo === filesync version
          perl bin\filesync version
          echo exit=%ERRORLEVEL%

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          prove -lr t/

      - name: Run Perl::Critic
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Perl::Critic
          perlcritic --severity 3 lib/ || true
        shell: bash

      - name: Check imports with perlimports
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest App::perlimports
          find lib -name '*.pm' | xargs perlimports --lint
        shell: bash

      - name: Test coverage
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Devel::Cover
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover
        shell: bash

      - name: Show cpanm build log and silent configures on failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          # One cpanm run writes every distribution's output to a single build
          # log.  The tail alone shows only the last failure, which is usually
          # a cascade from the real one, so print the context around each
          # failed configure/build as well as the end of the log.
          $log = Get-ChildItem "$env:USERPROFILE\.cpanm\work\*\build.log" |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) {
            Write-Output 'no cpanm build.log found'
            exit 0
          }
          Select-String -Path $log.FullName -Pattern '^-> N/A$|^-> FAIL' -Context 60,2
          Write-Output '=== tail'
          Get-Content $log.FullName -Tail 60

          # cpanm prints only "N/A" when a Makefile.PL exits without writing a
          # Makefile, and it records neither the script's output nor its exit
          # status.  A distribution that dies, crashes or takes a silent exit
          # is thereby invisible, so re-run every distribution that was
          # configured but left no Makefile behind, reporting what the script
          # actually said and how the process ended.
          $env:PERL_MM_USE_DEFAULT = '1'
          $configured = @(Get-Content $log.FullName |
            Select-String -Pattern '^Configuring (\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          $dirs = Get-ChildItem $log.Directory.FullName -Directory | Where-Object {
            ($configured -contains $_.Name) -and
            (Test-Path (Join-Path $_.FullName 'Makefile.PL')) -and
            -not (Test-Path (Join-Path $_.FullName 'Makefile'))
          }
          $interpreter = & perl -e 'print "$^V $^X"'
          Write-Output "=== re-running with perl $interpreter"
          if (-not $dirs) {
            Write-Output '=== no configured distribution was left without a Makefile'
          }
          foreach ($dir in $dirs) {
            Write-Output "=== re-running Makefile.PL in $($dir.Name)"
            Push-Location $dir.FullName
            $output = & perl Makefile.PL 2>&1 | Out-String
            $status = $LASTEXITCODE
            Pop-Location
            if ($output) {
              Write-Output $output.TrimEnd()
            } else {
              Write-Output '(the script printed nothing at all)'
            }
            if ($null -eq $status) {
              Write-Output 'exit code: unknown'
            } else {
              Write-Output ("exit code: {0} (0x{1:X8})" -f $status, $status)
            }
          }

      - name: Show cpanm build log on failure (non-Windows)
        if: runner.os != 'Windows' && failure()
        run: tail -100 "$HOME/.cpanm/work/*/build.log"
